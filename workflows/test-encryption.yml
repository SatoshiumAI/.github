name: 🔐 Test Encryption Workflow

on:
  push:
    branches:
      - main
      - phase003
  pull_request:

jobs:
  test-encryption:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies (if required)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping install"
          fi

      - name: 🧪 Run encryption tests (if present)
        run: |
          if [ -f test_encryption.py ]; then
            python test_encryption.py
          else
            echo "No encryption test file found — skipping"
          fi

      - name: ✅ Workflow complete
        run: echo "Encryption test workflow finished."
