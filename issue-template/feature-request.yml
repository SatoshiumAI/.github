name: ✨ Feature Request
description: Suggest an idea or improvement for the Satoshium platform infrastructure
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        ## ✨ Satoshium Feature Request
        
        Thank you for sharing ideas.
        
        Satoshium is being built deliberately and thoughtfully.  
        Suggestions are welcome and reviewed carefully for long-term alignment.
        
        Not every suggestion will be implemented, but all constructive ideas are appreciated.

  - type: input
    id: summary
    attributes:
      label: 🪪 Feature summary
      description: Provide a short, clear description of your idea
      placeholder: Example — Add glossary search, improve navigation, expand Bitcoin education section
    validations:
      required: true

## 🧱 Platform Layer Impact (optional)

  - type: textarea
    id: problem
    attributes:
      label: 🧭 Which platform layer does this idea relate to?
      description: Trust, Knowledge, Intelligence, Signal, Simulation, Developer, Navigation, Not sure yet.
      placeholder: Describe why this would be useful
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 💡 Proposed solution or idea
      description: Describe your suggested approach or feature
      placeholder: Provide a clear and thoughtful explanation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives considered (optional)
      description: Any other ideas or approaches considered?
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 🌐 Additional context
      description: Add links, screenshots, or supporting details
      placeholder: Optional but helpful
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### 🧠 Note
        
        Satoshium prioritizes clarity, durability, and long-term usefulness.
        
        Suggestions that align with these principles are most likely to be explored.
        
        Thank you for contributing thoughtful ideas.

