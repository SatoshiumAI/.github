name: 🐞 Bug Report
description: Report something that is not working as expected within the Satoshium platform infrastructure
title: "[BUG] "
labels: ["bug"]
assignees: []

body:

  - type: markdown
    attributes:
      value: |
        ## 🧭 Satoshium Bug Report
        
        Thank you for helping improve Satoshium.
        
        This project is being built carefully and publicly.  
        Clear, thoughtful reports help maintain stability and long-term quality.
        
        Please provide as much useful detail as possible.

  - type: input
    id: summary
    attributes:
      label: 🪪 Short summary
      description: Briefly describe the issue
      placeholder: Example — Page does not load correctly, link broken, formatting issue
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📋 Detailed description
      description: Explain what happened and what you expected to happen
      placeholder: Provide clear and structured details
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      description: How can this issue be reproduced?
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 🖥️ Environment (if applicable)
      description: Device, browser, OS, or context where the issue occurred
      placeholder: |
        Browser:
        Device:
        OS:
        governance services
        verification ledger
        registry surfaces
        simulations
        labs tools
        navigation layers
        validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📎 Additional context
      description: Add screenshots, links, or other helpful context
      placeholder: Optional but helpful
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### 🧠 Note
        
        Satoshium is a long-term public build.  
        Issues are reviewed thoughtfully and addressed when appropriate.
        
        Thank you for contributing to clarity and stability.
